[tools]
node = "26.13.1"

[tasks.setup]
description = "Install project dependencies"
run = "npm ci"

[tasks.frontend]
description = "Start the Vite development server"
run = "npm run dev"

[tasks.backend]
description = "Start the Fastify development server"
run = "npm run dev:server"

[tasks.build]
description = "Build the frontend"
run = "npm run build"

[tasks.check]
description = "Run the linter, type checks, and tests"
run = ["npm run lint", "npm run typecheck", "npm test"]
