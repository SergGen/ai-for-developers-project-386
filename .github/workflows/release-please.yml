name: Release Please

on:
  push:
    branches:
      - codex/hexlet-release-check

concurrency:
  group: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          target-branch: codex/hexlet-release-check
          skip-github-release: true
